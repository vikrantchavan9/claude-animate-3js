<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d1b2a;font-family:'Inter','Segoe UI',Arial,sans-serif}
#canvas-wrap{position:relative;width:1080px;height:1920px}
canvas{display:block;position:absolute;top:0;left:0;width:1080px!important;height:1920px!important}
#ui{position:absolute;top:0;left:0;width:1080px;height:1920px;pointer-events:none}

#chip{

  padding:14px 36px;border-radius:60px;
  font-size:30px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  white-space:nowrap;
  box-shadow:0 4px 24px rgba(255,224,52,0.28);
}

#card{
  position:absolute;top:230px;left:50%;transform:translateX(-50%);
  background:rgba(13,27,42,0.92);border:2px solid rgba(255,255,255,0.12);
  border-radius:28px;padding:36px 48px;width:900px;min-height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-size:34px;line-height:1.5;
  box-shadow:0 8px 60px rgba(0,0,0,0.5);
}
.card-title{font-size:28px;font-weight:700;color:#ffe034;margin-bottom:18px;letter-spacing:1px}
.big-num{font-size:88px;font-weight:900;color:#fff;line-height:1}
.counter-row{display:flex;gap:48px;align-items:flex-end;margin-top:12px}
.counter-col{text-align:center}
.counter-val{font-size:66px;font-weight:900;color:#ffe034;line-height:1}
.counter-label{font-size:24px;color:#8ea8c3;margin-top:4px;font-weight:600}
.rule-text{font-size:72px;font-weight:900;line-height:1.1;text-align:center}
.rule-text .gt{color:#ffe034}
.checklist{list-style:none;text-align:left;width:100%}
.checklist li{font-size:32px;padding:10px 0;display:flex;align-items:center;gap:16px;color:#c8d8e8}
.checklist li.done{color:#fff}
.check-box{width:36px;height:36px;border:3px solid #8ea8c3;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.check-box.ticked{background:#3dffa0;border-color:#3dffa0;color:#0d1b2a}
.energy-bar-wrap{width:100%;margin-top:12px}
.energy-label{font-size:28px;color:#8ea8c3;margin-bottom:10px}
.energy-bar{height:32px;background:#1e3050;border-radius:16px;overflow:hidden}
.energy-fill{height:100%;border-radius:16px;background:linear-gradient(90deg,#ffe034,#ff8c00)}
.icon-row{display:flex;gap:36px;margin-top:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.move-icon{
  width:140px;height:140px;background:rgba(255,255,255,0.08);
  border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:52px;color:#fff;border:2px solid transparent;
  position:relative;
}
.move-icon.active{border-color:#ffe034;background:rgba(255,224,52,0.1)}
.move-icon .move-label{font-size:17px;color:#8ea8c3;margin-top:6px;font-weight:600;letter-spacing:0.5px}
.move-icon .check-badge{
  position:absolute;top:-10px;right:-10px;width:32px;height:32px;
  background:#3dffa0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#0d1b2a;font-weight:900;
}
.round-dots{display:flex;gap:28px;margin-top:12px}
.round-dot{width:52px;height:52px;border-radius:50%;background:#1e3050;border:3px solid #2a4a70}
.round-dot.filled{background:#ffe034;border-color:#ffe034}
.total-time{font-size:62px;font-weight:900;color:#fff;margin-top:18px}
.total-time .accent{color:#ffe034}
.calendar-grid{display:grid;grid-template-columns:repeat(7,60px);gap:14px;margin-top:12px}
.cal-day{width:60px;height:60px;border-radius:12px;background:#1e3050;border:2px solid #2a4a70;
  display:flex;align-items:center;justify-content:center;font-size:28px;color:#2a4a70}
.cal-day.ticked{background:#3dffa0;border-color:#3dffa0;color:#0d1b2a;font-size:30px;font-weight:900}
.cta-word{font-size:110px;font-weight:900;color:#ffe034;letter-spacing:4px;line-height:1}
.cta-sub{font-size:34px;color:#8ea8c3;margin-top:12px;font-weight:600}
.jaw-drop{font-size:90px;font-weight:900;color:#fff;text-align:center}
.countdown-timer{font-size:100px;font-weight:900;color:#fff;text-align:center;line-height:1.2}
.countdown-timer .strike{text-decoration:line-through;color:#ff4444;font-size:60px}
.countdown-timer .accent{color:#ffe034}
.done-stamp{
  font-size:60px;font-weight:900;color:#3dffa0;border:5px solid #3dffa0;
  padding:8px 32px;border-radius:16px;margin-top:16px;
  display:inline-block;letter-spacing:4px;transform:rotate(-3deg);
}
@keyframes wobble{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}

#subtitle{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  width:960px;text-align:center;
  background:rgba(0,0,0,0.65);border-radius:16px;padding:22px 36px;
  color:#fff;font-size:36px;line-height:1.5;font-weight:500;
}
#subtitle .speaker{font-size:24px;font-weight:700;color:#ffe034;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
</style>
</head>

const canvas=document.getElementById('bg');

  backWall: mk(0x0d1b2a,0.85),

// ── GEO HELPERS ───────────────────────────────────────────────────────────────
function bx(w,h,d,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(px,py,pz);m.rotation.set(rx,ry,rz);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function cy(r,h,mat,px=0,py=0,pz=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);
  m.position.set(px,py,pz);m.castShadow=true;m.receiveShadow=true;return m;
}
function add(parent,...kids){kids.forEach(k=>parent.add(k));return parent;}

scene.add(bx(32,0.2,0.4,MAT.trim,0,16,-6.0)); // top trim

scene.add(bx(0.3,18,32,MAT.backWall,-9,9,0));

// Squat rack (right background)
{

const vikG=new THREE.Group();vikG.position.set(-1.6,0,0);

const tickCrown=bx(0.15,0.24,0.15,MAT.tickBody,0,1.98,0);
const tickLegL=bx(0.19,0.58,0.19,MAT.tickBody,-0.23,0.79,0);
const tickLegR=bx(0.19,0.58,0.19,MAT.tickBody, 0.23,0.79,0);
const tickFtL=bx(0.24,0.15,0.34,MAT.shoe,-0.23,0.5,0.07);
const tickFtR=bx(0.24,0.15,0.34,MAT.shoe, 0.23,0.5,0.07);
const tickALG=new THREE.Group();tickALG.position.set(-0.58,1.74,0);
add(tickALG,bx(0.14,0.72,0.14,MAT.tickArm,0,-0.36,0),bx(0.1,0.22,0.1,MAT.tickAcct,0,-0.82,0));

add(tickARG,bx(0.14,0.72,0.14,MAT.tickArm,0,-0.36,0),bx(0.1,0.22,0.1,MAT.tickAcct,0,-0.82,0));

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtHMS(sec){
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtMMS(sec){
  const m=Math.floor(sec/60),s=Math.floor(sec%60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function clamp01(x){return Math.max(0,Math.min(1,x));}
function lerp(a,b,t){return a+(b-a)*t;}

// ── CARD BUILDER ─────────────────────────────────────────────────────────────
function buildCard(idx,t){
  const L=LINES[idx];
  const lo=t-L.start;
  switch(L.card){
    case 'countdown':{
      const v=lerp(7200,900,clamp01(lo/1.4));
      return `<div class="card-title">YOUR SESSION</div>
        <div class="countdown-timer">
          <div class="strike">2:00:00</div>
          <div class="accent">${fmtHMS(v)}</div>
        </div>`;
    }
    case 'counters':{
      const p=clamp01(lo/1.8);
      return `<div class="counter-row">
        <div class="counter-col"><div class="counter-val">${Math.round(lerp(0,15,p))}</div><div class="counter-label">MIN</div></div>
        <div class="counter-col"><div class="counter-val">${Math.round(lerp(0,4,p))}</div><div class="counter-label">MOVES</div></div>
        <div class="counter-col"><div class="counter-val">0</div><div class="counter-label">EQUIPMENT</div></div>
      </div>`;
    }
    case 'energy':{
      const pct=Math.max(8,100-Math.round(clamp01(lo/2.4)*92));
      return `<div class="card-title" style="color:#ff6b6b">COACH VIK — 2 HRS LOGGED</div>
        <div class="energy-bar-wrap">
          <div class="energy-label">ENERGY REMAINING</div>
          <div class="energy-bar"><div class="energy-fill" style="width:${pct}%"></div></div>
        </div>`;
    }
    case 'rule':
      return `<div class="rule-text">Consistent <span class="gt">&gt;</span> Long</div>`;
    case 'checklist0':
      return `<ul class="checklist">
        ${['☐ Warm-up 2:00','☐ Four moves','☐ Three rounds 12:00','☐ Stretch 1:00'].map(i=>`<li><span>${i}</span></li>`).join('')}
      </ul><div style="margin-top:16px;font-size:28px;color:#ffe034;font-weight:800">= 15:00</div>`;
    case 'step1':{
      const dur=14-11;
      const remaining=Math.max(0,120-lo*(120/dur));
      return `<ul class="checklist">
        <li class="done"><span class="check-box ticked">✓</span>Warm-up 2:00</li>
        <li><span class="check-box"></span>Four moves</li>
        <li><span class="check-box"></span>Three rounds 12:00</li>
        <li><span class="check-box"></span>Stretch 1:00</li>
      </ul>
      <div class="total-time" style="margin-top:14px"><span class="accent">${fmtMMS(remaining)}</span></div>`;
    }
    case 'step2':{
      const dur=17.5-14;
      const moves=[['🏋️','SQUAT'],['💪','PUSHUP'],['🦵','LUNGE'],['🧘','PLANK']];
      const nV=Math.min(4,Math.floor(lo/(dur/4))+1);
      return `<div class="icon-row">${moves.slice(0,nV).map(([e,l],i)=>
        `<div class="move-icon${i===nV-1?' active':''}"><span>${e}</span><span class="move-label">${l}</span></div>`
      ).join('')}</div>`;
    }
    case 'knee-ouch':
      return `<div class="icon-row">
        <div class="move-icon active" style="border-color:#ff6b6b;animation:wobble 0.4s ease-in-out infinite alternate">
          <span>💪</span><span class="move-label">PUSHUP</span>
        </div>
      </div><div style="font-size:28px;color:#ff6b6b;margin-top:16px">Ouch 😬</div>`;
    case 'knee-ok':
      return `<div class="icon-row">
        <div class="move-icon active" style="border-color:#3dffa0">
          <span>💪</span><span class="move-label">KNEES DOWN</span>
          <span class="check-badge">✓</span>
        </div>
      </div><div style="font-size:28px;color:#3dffa0;margin-top:16px;font-weight:700">MODIFICATION ✓</div>`;
    case 'interval':{
      const cycle=60;
      const phase=(lo*3)%cycle;
      const isOn=phase<=40;
      const sweep=Math.min(phase,40)/40;
      const col=isOn?'#3dffa0':'#555';
      const ang=sweep*Math.PI*2;
      const r=86,cx=100,cy=100;
      const ex=cx+r*Math.sin(ang),ey=cy-r*Math.cos(ang);
      const big=ang>Math.PI?1:0;
      const pathD=ang<0.01?'':`M${cx},${cy-r} A${r},${r},0,${big},1,${ex},${ey} L${cx},${cy} Z`;
      return `<div class="card-title">INTERVAL TIMER</div>
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1e3050" stroke-width="20"/>
          ${pathD?`<path d="${pathD}" fill="${col}" opacity="0.85"/>`:''}
          <circle cx="${cx}" cy="${cy}" r="${r-10}" fill="none" stroke="${col}" stroke-width="1.5"/>
          <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#fff" font-size="28" font-weight="900" font-family="Inter,sans-serif">${isOn?'ON':'REST'}</text>
          <text x="${cx}" y="${cy+22}" text-anchor="middle" fill="${col}" font-size="22" font-weight="700" font-family="Inter,sans-serif">${isOn?'40 SEC':'20 SEC'}</text>
        </svg>`;
    }
    case 'rounds':{
      const dur=29-26;
      const p=clamp01(lo/dur);
      const nF=Math.min(3,Math.floor(p*3)+1);
      return `<div class="card-title">3 ROUNDS</div>
        <div class="round-dots">
          ${[0,1,2].map(i=>`<div class="round-dot${i<nF?' filled':''}"></div>`).join('')}
        </div>
        <div class="total-time">${fmtMMS(Math.round(p*720))} <span style="font-size:26px;color:#8ea8c3">/ 12:00</span></div>`;
    }
    case 'step5':{
      const done=lo>1;
      return `<ul class="checklist">
        <li class="done"><span class="check-box ticked">✓</span>Warm-up 2:00</li>
        <li class="done"><span class="check-box ticked">✓</span>Four moves</li>
        <li class="done"><span class="check-box ticked">✓</span>Three rounds 12:00</li>
        <li class="done"><span class="check-box ticked">✓</span>Stretch 1:00</li>
      </ul>
      <div class="total-time" style="margin-top:14px"><span class="accent">15:00</span></div>
      ${done?'<div class="done-stamp">DONE</div>':''}`;
    }
    case 'jaw-drop':
      return `<div class="jaw-drop"><span class="accent">15:00</span></div>
        <div style="font-size:36px;color:#8ea8c3;margin-top:12px;font-weight:600">No equipment. Any room.</div>`;
    case 'calendar':{
      const dur=36-34;
      const nT=Math.min(7,Math.ceil(lo/(dur/7)));
      return `<div class="card-title">EVERY DAY</div>
        <div class="calendar-grid">
          ${Array(7).fill(0).map((_,i)=>`<div class="cal-day${i<nT?' ticked':''}">${i<nT?'✓':'·'}</div>`).join('')}
        </div>`;
    }
    case 'cta':{
      const pulse=1+Math.sin(lo*4)*0.07;
      return `<div class="cta-word" style="transform:scale(${pulse.toFixed(3)})">ROUTINE</div>
        <div class="cta-sub">full guide ↓</div>`;
    }
    default:return '';
  }
}

// ── UI ELEMENTS ───────────────────────────────────────────────────────────────
const chipEl=document.getElementById('chip');
const cardEl=document.getElementById('card');
const spkNameEl=document.getElementById('spk-name');
const spkLineEl=document.getElementById('spk-line');

function getIdx(t){
  for(let i=LINES.length-1;i>=0;i--)if(t>=LINES[i].start)return i;
  return 0;
}

// ── CHARACTER ANIMATION ───────────────────────────────────────────────────────
function animVik(t,idx,speaking){
  const breathe=Math.sin(t*2.1)*0.025;
  vikTorso.scale.y=1+breathe;
  vikHG.position.y=2.76+breathe*0.5;
  vikG.position.x=-1.6+Math.sin(t*0.73)*0.03;
  vikArmLG.rotation.z= Math.sin(t*1.1)*0.1+0.08;
  vikArmRG.rotation.z=-Math.sin(t*1.1)*0.1-0.08;
  if(speaking){
    vikHG.rotation.x=Math.sin(t*5)*0.065;
    const open=Math.abs(Math.sin(t*8))*0.07;
    vikMG.rotation.x=-open*2;
    vikMouth.scale.y=1+open*4;
  }else{
    vikHG.rotation.x*=0.85;
    vikMG.rotation.x*=0.85;
    vikMouth.scale.y=1+(vikMouth.scale.y-1)*0.85;
  }
  // Line-specific reactions
  vikHG.rotation.z=0;
  vikBrowL.rotation.z=0;vikBrowR.rotation.z=0;
  vikBrowL.position.y=0.26;vikBrowR.position.y=0.26;
  if(idx===7){// wince
    vikHG.rotation.z=Math.sin(t*3)*0.07;
    vikBrowL.rotation.z=0.2;vikBrowR.rotation.z=-0.2;
  }
  if(idx===12){// jaw drop
    vikMG.rotation.x=-0.35;vikMouth.scale.y=2.6;
    vikBrowL.position.y=0.34;vikBrowR.position.y=0.34;
  }
}

function animTick(t,idx,speaking){
  tickHndG.rotation.z=-t*Math.PI; // 1 rev per 2s
  tickG.position.y=Math.sin(t*2.3)*0.038;
  if(speaking){
    tickALG.rotation.z= Math.sin(t*4)*0.3+0.4;
    tickARG.rotation.z=-Math.sin(t*4+1)*0.3-0.4;
  }else{
    tickALG.rotation.z=0.15;tickARG.rotation.z=-0.15;
  }
  const pleased=[1,3,5,6,8,9,10,11,13].includes(idx)&&speaking;
  if(pleased){
    tickEyeL.rotation.z= 0.5;tickEyeR.rotation.z=-0.5;
    tickEyeL.scale.y=0.55;tickEyeR.scale.y=0.55;
  }else{
    tickEyeL.rotation.z=0;tickEyeR.rotation.z=0;
    tickEyeL.scale.y=1;tickEyeR.scale.y=1;
  }
  // Crown bob on tick cues
  const nearCue=window.cues.some(c=>Math.abs(t-c.t)<0.13&&c.type==='tick');
  tickCrown.position.y=nearCue?1.945:1.98;
}

// ── CAMERA ────────────────────────────────────────────────────────────────────
function updateCam(t,idx){
  const shot=SHOTS[Math.min(idx,SHOTS.length-1)];
  const def=CAM_DEFS[shot.type];
  const L=LINES[idx];
  const p=clamp01((t-L.start)/(L.end-L.start));
  const pushAmt=shot.push*p;
  const dir=new THREE.Vector3().subVectors(def.tgt,def.pos).normalize();
  const pos=def.pos.clone().addScaledVector(dir,pushAmt*3);
  // Deterministic handheld wobble
  const wobble=0.0025;
  camera.position.set(
    pos.x+Math.sin(t*0.47+idx*2.1)*wobble,
    pos.y+Math.sin(t*0.63+idx*3.3)*wobble,
    pos.z
  );
  camera.lookAt(def.tgt);
}

// ── RENDER FRAME ──────────────────────────────────────────────────────────────
window.renderFrame=function(t){
  t=Math.max(0,Math.min(t,40));
  const idx=getIdx(t);
  const L=LINES[idx];
  const meSpk=L.speaker==='ME';
  const tickSpk=L.speaker==='SIDEKICK';

  animVik(t,idx,meSpk);
  animTick(t,idx,tickSpk);
  updateCam(t,idx);
  renderer.render(scene,camera);

  chipEl.textContent=L.chip;
  cardEl.innerHTML=buildCard(idx,t);
  spkNameEl.textContent=L.name;
  spkLineEl.textContent=L.line;
};

window.ready=(async function(){
  try{
    const f=new FontFace('Inter',
      'url(https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2)');
    await f.load();document.fonts.add(f);
  }catch(e){/* use system fallback */}
  window.renderFrame(0);
  window.__READY_TO_RENDER__=true;
})();
</script>
